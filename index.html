<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Tailwind CSS - Ejercicio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-200 p-6 flex flex-col items-center min-h-screen font-sans">

  <!-- ===== CAJAS DE ARRIBA ===== -->

  <div class="w-full max-w-3xl border-2 border-purple-600 bg-blue-200 p-3 mb-2 text-center">
    <h1 class="text-2xl font-bold text-blue-900">Hola mundo, probando tailwind</h1>
  </div>

  <div class="w-full max-w-3xl border-2 border-purple-600 bg-blue-200 p-3 mb-2 text-center">
    <h2 class="text-xl font-semibold text-blue-900">Tailwind por: Wara Velasquez</h2>
  </div>

  <div class="w-full max-w-3xl border-2 border-purple-600 bg-blue-200 p-3 mb-6 text-center">
    <p class="text-sm text-blue-800">
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Voluptatem, molestiae! Sint porro eos dolorem doloremque voluptates iste blanditiis...
    </p>
  </div>

  <!-- ===== CONTENEDOR DE IMÁGENES ===== -->
  <div class="w-full max-w-3xl border-2 border-purple-600 bg-blue-200 p-6 mb-4">

    <!-- Círculos -->
    <div class="flex flex-wrap justify-center gap-10 mb-8">
      <div class="w-28 h-28 rounded-full overflow-hidden">
        <img src="img/1.jpg" alt="blur" class="w-full h-full object-cover blur-md">
      </div>

      <div class="w-28 h-28 rounded-full overflow-hidden">
        <img src="img/4.jpg" alt="transparente" class="w-full h-full object-cover opacity-70">
      </div>

      <div class="w-28 h-28 rounded-full overflow-hidden">
        <img src="img/2.png" alt="escala de grises" class="w-full h-full object-cover grayscale">
      </div>
    </div>

    <!-- Cuadrados -->
    <div class="flex flex-wrap justify-center gap-10">
      <div class="w-24 h-24 overflow-hidden">
        <img src="img/4.jpg" alt="intensidad" class="w-full h-full object-cover brightness-125 contrast-125">
      </div>

      <div class="w-24 h-24 overflow-hidden">
        <img src="img/5.jpg" alt="opacidad" class="w-full h-full object-cover opacity-60">
      </div>

      <div class="w-24 h-24 overflow-hidden">
        <img src="img/6.jpg" alt="libre" class="w-full h-full object-cover">
      </div>
    </div>

  </div>

  <!-- Crédito -->
  <div class="w-full max-w-3xl border-2 border-purple-600 bg-blue-200 p-3 text-center">
    <p class="text-blue-900 font-medium">
      diseñado por: <span class="font-bold">Wara Velasquez</span>
    </p>
  </div>

</body>
</html>
